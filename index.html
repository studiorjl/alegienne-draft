<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALEGIENNE | Coming soon</title>
  <meta name="description" content="Alegienne, a brand dedicated to creating heartfelt artefacts and tea with love. Sign up to receive word when we launch.">
  <meta name="robots" content="index, follow, max-image-preview:large, noai, noimageai">
  <meta name="theme-color" content="#2d0c09">
  <meta property="og:title" content="Alegienne | Coming soon">
  <meta property="og:description" content="Alegienne, a brand dedicated to creating heartfelt artefacts and tea with love. Sign up to receive word when we launch.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.alegienne.com.au/">
  <meta property="og:site_name" content="Alegienne">
  <link rel="canonical" href="https://www.alegienne.com.au/">
  <link rel="icon" type="image/png" href="Alegienne-favicon.png">
  <link rel="preload" as="image" href="coming-soon-gold.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    :root {
      --maroon: #2d0c09;
      --blush: #d2b2a6;
      --paper: #e7dcd0;
      --sage: #8e7b58;
      --blush-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><circle cx='11' cy='11' r='7' fill='%23d2b2a6' stroke='%232d0c09' stroke-width='1.5'/></svg>") 11 11, auto;
    }

    * { box-sizing: border-box; cursor: var(--blush-cursor); }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--maroon);
      background-image:
        radial-gradient(ellipse at 50% 30%, rgba(45, 12, 9, 0.18), rgba(45, 12, 9, 0.62) 78%),
        url("./plume-assets/plume-texture-bg.jpg");
      background-size: cover, cover;
      background-position: center, center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--blush);
      font-family: "PT Mono", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 1000px);
      flex: 1;
      padding: clamp(40px, 8vh, 88px) clamp(20px, 6vw, 64px) clamp(24px, 4vh, 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .wordmark {
      width: 136.39px;
      height: auto;
      display: block;
      margin-bottom: clamp(28px, 5vh, 52px);
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.35));
    }

    .coming-soon {
      width: 50%;
      max-width: 520px;
      height: auto;
      display: block;
    }

    .signup-copy {
      margin: clamp(18px, 3vh, 28px) 0 clamp(18px, 3vh, 28px);
      font-size: clamp(0.6rem, 1.56vw, 0.69rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.7;
    }

    .email-form { width: 49%; margin: 0 auto; }

    .input-group {
      display: flex;
      align-items: stretch;
      background: var(--paper);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.35);
    }

    .email-input {
      flex: 1 1 auto;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--maroon);
      font: inherit;
      font-size: 0.784rem;
      padding: clamp(11.2px, 1.76vw, 13.6px) clamp(12.8px, 1.92vw, 16px);
      outline: none;
    }

    .email-input::placeholder { color: rgba(45, 12, 9, 0.55); }

    .submit-btn {
      flex: 0 0 auto;
      border: 0;
      background: var(--blush);
      color: var(--maroon);
      font: inherit;
      font-size: 0.784rem;
      font-style: italic;
      padding: clamp(11.2px, 1.76vw, 13.6px) clamp(14.4px, 2.08vw, 19.2px);
      cursor: var(--blush-cursor);
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .submit-btn:hover { background: var(--sage); }
    .submit-btn:disabled { opacity: 0.45; }

    .form-status {
      margin: 14px 0 0;
      min-height: 1.4em;
      font-size: 0.552rem;
      font-style: italic;
      letter-spacing: 0.02em;
      opacity: 0.92;
    }

    .roses {
      width: 35%;
      max-width: 480px;
      height: auto;
      display: block;
      margin-top: clamp(28px, 5vh, 56px);
    }

    .signature {
      width: 34%;
      max-width: 320px;
      height: auto;
      display: block;
      margin-top: clamp(16px, 3vh, 30px);
    }

    footer {
      width: 100%;
      padding: 12px 20px 16px;
      text-align: center;
      font-size: 0.48rem;
      letter-spacing: 0.06em;
      color: rgba(235, 214, 206, 0.72);
      background: rgba(45, 12, 9, 0.55);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    /* each element arrives */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .fade-in { animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    main > :nth-child(1) { animation-delay: 0.05s; }
    main > :nth-child(2) { animation-delay: 0.25s; }
    .signup-copy.typing::after {
      content: "|";
      margin-left: 1px;
      animation: blink 1s steps(1, end) infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* the line types itself, then the rest of the page arrives */
    html.js .email-form, html.js .roses, html.js .signature, html.js footer { opacity: 0; }
    html.js.typed .email-form { animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    html.js.typed .roses { animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.2s both; }
    html.js.typed .signature { animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.4s both; }
    html.js.typed footer { animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s both; }

    @media (prefers-reduced-motion: reduce) {
      .fade-in, footer { animation: none; }
      html.js .email-form, html.js .roses, html.js .signature, html.js footer { opacity: 1; }
      .signup-copy.typing::after { content: none; }
    }

    /* mobile, per the shopify settings */
    @media (max-width: 749px) {
      .wordmark { width: 30%; max-width: 220px; margin-bottom: clamp(24px, 5vh, 44px); }
      .coming-soon { width: 82%; }
      .email-form { width: 86%; }
      .roses { width: 84%; }
      .signature { width: 55%; }
    }
  </style>
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <main>
    <img class="wordmark fade-in" src="alegienne-wordmark-gold.webp" alt="Alegienne" width="420" height="148" decoding="async">
    <img class="coming-soon fade-in" src="coming-soon-gold.webp" alt="coming soon" width="1000" height="602" decoding="async" fetchpriority="high">
    <p class="signup-copy">sign up to receive word when we launch x</p>
    <form class="email-form" data-subscribe-form>
      <div class="input-group">
        <label for="email" style="position:absolute;left:-9999px;">Email</label>
        <input class="email-input" id="email" name="email" type="email" placeholder="Email address" autocomplete="email" autocapitalize="off" autocorrect="off" required>
        <button class="submit-btn" type="submit" data-subscribe-submit>yes please.</button>
      </div>
      <p class="form-status" data-subscribe-status role="status" aria-live="polite"></p>
    </form>
    <img class="roses" src="alegienne-roses-web.webp" alt="garden roses in a jar, with love" width="680" height="1024" decoding="async">
    <img class="signature" src="alegienne-signature-gold.webp" alt="with love, Alegienne" width="260" height="121" decoding="async">
  </main>
  <footer>&copy; always, Alegienne.</footer>
  <script>
    (() => {
      // the sign-up line arrives letter by letter, then the page follows
      const copyEl = document.querySelector(".signup-copy");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (copyEl && !reduced) {
        const text = copyEl.textContent;
        copyEl.textContent = "";
        copyEl.classList.add("typing");
        let i = 0;
        window.setTimeout(function step() {
          i += 1;
          copyEl.textContent = text.slice(0, i);
          if (i < text.length) {
            window.setTimeout(step, 42);
          } else {
            copyEl.classList.remove("typing");
            document.documentElement.classList.add("typed");
          }
        }, 500);
      } else if (copyEl) {
        document.documentElement.classList.add("typed");
      }

      const form = document.querySelector("[data-subscribe-form]");
      if (!form) return;
      const status = form.querySelector("[data-subscribe-status]");
      const endpoint = "https://rjl-publisher-insights-agent-a07f3048.base44.app/functions/subscribeAlegienne?format=json";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = form.querySelector('[name="email"]').value.trim();
        const submitBtn = form.querySelector("[data-subscribe-submit]");

        if (!email) {
          status.textContent = "please add your email.";
          return;
        }

        status.textContent = "sending…";
        if (submitBtn) submitBtn.disabled = true;

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, launch: true }),
          });
          if (!res.ok) throw new Error("failed");
          const data = await res.json().catch(() => ({}));
          status.textContent = data.duplicated
            ? "you're already on the list — see you at the launch, x"
            : "you're in — welcome to the list, x";
          form.reset();
        } catch (error) {
          status.textContent = "something went sideways — try again, or write to info@alegienne.com.au";
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });
    })();

    // no right click, and no dragging the images
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("dragstart", (event) => {
      if (event.target.tagName === "IMG") event.preventDefault();
    });
  </script>
</body>
</html>
