<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALEGIENNE | Coming soon</title>
  <meta name="robots" content="index, follow, max-image-preview:large, noai, noimageai">
  <meta name="description" content="Alegienne, a brand dedicated to creating heartfelt artefacts and tea with love. Online soon xo">
  <meta property="og:title" content="ALEGIENNE | Coming soon">
  <meta property="og:description" content="Discover Alegienne, a brand dedicated to creating heartfelt products with love.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="alegienne_gold.png">

  <link rel="icon" type="image/png" href="Alegienne-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">

  <style>
    :root {
      --ink: #2a211b;
      --muted: #806f61;
      --paper: #f8f4ef;
      --cream: #fffaf3;
      --rose: #d6a9a0;
      --gold: #b8904e;
      --shadow: 0 26px 80px rgba(65, 46, 30, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);

      background:
        radial-gradient(circle at 15% 20%, rgba(214, 169, 160, 0.2), transparent 34rem),
        linear-gradient(145deg, #fffaf3 0%, #f6efe6 48%, #fffdf8 100%);
      font-family: "Libre Baskerville", Georgia, serif;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(88px, 14vw, 120px) clamp(18px, 5vw, 64px) clamp(28px, 6vw, 80px);
    }

    .coming-soon {
      width: min(100%, 920px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vw, 34px);
      text-align: center;
    }

    .logo {
      width: auto;
      max-width: min(86vw, 620px);
      max-height: 33vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 42px rgba(65, 46, 30, 0.1));
    }

    .divider {
      width: clamp(72px, 14vw, 140px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184, 144, 78, 0.85), transparent);
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.82rem, 2.2vw, 1rem);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    .signature {
      width: min(60vw, 490px);
      max-height: 20vh;
      object-fit: contain;
      opacity: 0.94;
    }

    @media (max-width: 640px) {
      .page {
        align-items: start;
        padding-top: clamp(52px, 12vh, 92px);
      }

      .logo {
        max-width: 88vw;
        max-height: 50vh;
      }

      .signature {
        width: min(90vw, 310px);
        max-height: 36vh;
      }
    }

    @media (min-width: 1100px) {
      .coming-soon {
        gap: 34px;
      }
    }
  </style>

  <!-- alegienne cursor: a little dark maroon circle, in the manner of studio rjl -->
  <style>
    * { cursor: none !important; }
    .alegienne-cursor {
      position: fixed; top: 0; left: 0; z-index: 10000;
      width: 13px; height: 13px; border-radius: 50%;
      background: #300505; opacity: 0; pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: left, top, transform;
      transition: background 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }
    .alegienne-cursor.visible { opacity: 1; }
    .alegienne-cursor.link-hover { background: #b8904e; transform: translate(-50%, -50%) scale(1.18); }
    .alegienne-cursor.on-dark { background: #f8f4ef; }
    .alegienne-cursor.on-dark.link-hover { background: #d6a9a0; }
  </style>
</head>

<body>
  <main class="page" aria-label="Alegienne coming soon">
    <section class="coming-soon">
      <img src="coming soon_gold_transparent.png" alt="Alegienne Coming Soon" class="logo">

      <div class="divider" aria-hidden="true"></div>

      <p class="tagline">with love, from alegienne.</p>

      <img src="alegienne_hand_gold_transparent.png" alt="with love from alegienne x" class="signature">
    </section>
  </main>

  <div class="alegienne-cursor" aria-hidden="true"></div>
  <script>
    (function () {
      var cursor = document.querySelector(".alegienne-cursor");
      if (!cursor) return;

      // no right-click anywhere on alegienne
      document.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      document.addEventListener("mousemove", function (event) {
        cursor.style.left = event.clientX + "px";
        cursor.style.top = event.clientY + "px";
        cursor.classList.add("visible");
      });
      document.addEventListener("mouseleave", function () { cursor.classList.remove("visible"); });

      document.addEventListener("mouseover", function (event) {
        var target = event.target;
        var hoverables = 'a, button, [role="button"], input, textarea, select, label, summary';
        cursor.classList.toggle("link-hover", !!(target.closest && target.closest(hoverables)));
        var node = target, dark = false, steps = 0;
        while (node && steps < 8) {
          var bg = window.getComputedStyle(node).backgroundColor;
          if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
            var m = bg.match(/\d+/g);
            if (m) {
              var lum = (0.299 * +m[0]) + (0.587 * +m[1]) + (0.114 * +m[2]);
              dark = lum < 96;
            }
            break;
          }
          node = node.parentElement; steps++;
        }
        cursor.classList.toggle("on-dark", dark);
      });
    })();
  </script>
</body>
</html>
