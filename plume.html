  <!-- alegienne cursor: a little dark maroon circle, in the manner of studio rjl -->
  <style>
    * { cursor: none !important; }
    .alegienne-cursor {
      position: fixed; top: 0; left: 0; z-index: 10000;
      width: 13px; height: 13px; border-radius: 50%;
      background: #300505; opacity: 0; pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: left, top, transform;
      transition: background 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }
    .alegienne-cursor.visible { opacity: 1; }
    .alegienne-cursor.link-hover { background: #b8904e; transform: translate(-50%, -50%) scale(1.18); }
    .alegienne-cursor.on-dark { background: #f8f4ef; }
    .alegienne-cursor.on-dark.link-hover { background: #d6a9a0; }
  </style>
</head>

<body>

  <!-- temporarily hidden — restore when ready
  <button type="button" class="aleg-menu-btn plume-nav-open" data-aleg-menu-open aria-expanded="false" aria-label="Open menu">
    <span></span><span></span>
  </button>
  -->

<!-- temporarily hidden along with the menu button
  <div class="aleg-panel" data-aleg-panel aria-hidden="true">
    <button type="button" class="aleg-panel-close" data-aleg-menu-close aria-label="Close menu">

    </button>

  <!-- the smoke, for the whole scroll (landing page only — the

       logo opens and the welcome types — PlumeUI starts it from the very

  <video class="video-bg" muted loop playsinline disablepictureinpicture
         poster="/plume-assets/plume-bg-poster.jpg" aria-hidden="true">
    <source src="/plume-assets/plume-smoke-bg-pingpong.webm" type="video/webm">
    <source src="/plume-assets/plume-smoke-bg-pingpong.mp4" type="video/mp4">
  </video>

  <!-- optional, for anyone motion-sensitive who wants the smoke still

    <svg class="icon-play" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M2.8 1.2v9.6l7.6-4.8z"/></svg>
  </button>

  <!-- 1. Plume -->
  <div class="plume-stage">

  </div>

  <div class="container">

    <!-- 2. The welcome, typed -->
    <!-- two line breaks of breathing room below the plume logo —
         page-scoped so the batch/privacy headers keep their own spacing -->
    <h1 aria-label="why, hello there gorgeous" style="margin-top: 66px;"><span class="type" aria-hidden="true">why, hello there gorgeous</span><span class="cursor" aria-hidden="true"></span></h1>

    <!-- 3. The buttons -->
    <div class="actions">
      <!-- points to the current season's batch page — update this href each
           time a new batch goes live (see the batch template at
           /plume/b/01/index.html for how to add a new one) -->
      <!-- temporarily hidden while we test the pilot batch — restore for subsequent batch blends
      <a class="btn stack" href="/plume/b/01/" aria-label="explore the botanicals — current batch">
        <span class="btn-line">explore the botanicals</span>
        <span class="btn-line">get acquainted with the plants in plume</span>
      </a>
      -->
    </div>

    <!-- 4. Everything below, arriving in sequence as you scroll -->

    <div class="divider reveal"></div>

    <p class="verse reveal">
      <span class="verse-lead">PLUME</span><br>
      a seasonal botanic smoke blend.<br><br>
      ...for baddies.<br><br>
    </p>

    <div class="divider reveal"></div>

    <p class="verse reveal">
      roll me,<br>
      <i>smoulder</i> me. <br>
      inhale me, <br><br>

    <div class="divider reveal"></div>

    <p class="tagline reveal">
    </p>

    <!-- the re-order button, waiting at the very end of the scroll -->

  <noscript>
    <style>
      .btn, .reveal, .reveal:not(.visible) { opacity: 1 !important; transform: none !important; }
      .divider.reveal { transform: scaleX(1) !important; }
      .cursor { display: none; }
    </style>
  </noscript>

  <script src="/plume-assets/plume-shared.js?v=24"></script>
  <!-- speed 46ms: the welcome types a touch slower than the default 38ms -->
  <script>PlumeUI.init({ speed: 46 });</script>
  <script src="/nav-assets/nav-shared.js" defer></script>

  <div class="alegienne-cursor" aria-hidden="true"></div>
  <script>
    (function () {
      var cursor = document.querySelector(".alegienne-cursor");
      if (!cursor) return;

      // no right-click anywhere on alegienne
      document.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      document.addEventListener("mousemove", function (event) {
        cursor.style.left = event.clientX + "px";
        cursor.style.top = event.clientY + "px";
        cursor.classList.add("visible");
      });
      document.addEventListener("mouseleave", function () { cursor.classList.remove("visible"); });

      document.addEventListener("mouseover", function (event) {
        var target = event.target;
        var hoverables = 'a, button, [role="button"], input, textarea, select, label, summary';
        cursor.classList.toggle("link-hover", !!(target.closest && target.closest(hoverables)));
        var node = target, dark = false, steps = 0;
        while (node && steps < 8) {
          var bg = window.getComputedStyle(node).backgroundColor;
          if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
            var m = bg.match(/\d+/g);
            if (m) {
              var lum = (0.299 * +m[0]) + (0.587 * +m[1]) + (0.114 * +m[2]);
              dark = lum < 96;
            }
            break;
          }
          node = node.parentElement; steps++;
        }
        cursor.classList.toggle("on-dark", dark);
      });
    })();
  </script>
</body>
