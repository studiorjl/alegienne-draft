<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plume — alegienne</title>
  <meta name="description" content="plume · seasonal botanic smoke blend, by alegienne.">
  <meta name="theme-color" content="#1f0a04">
  <meta property="og:title" content="plume — alegienne">
  <meta property="og:description" content="seasonal botanical smoke blends, grown and blended in the forest garden apothecary.">
  <meta property="og:image" content="https://alegienne.com.au/plume-assets/plume-bg-poster.jpg">
  <link rel="canonical" href="https://alegienne.com.au/plume">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Alegienne-favicon.png">

  <!-- shared plume style guide — see /plume-assets/plume-shared.css -->
  <link rel="stylesheet" href="/plume-assets/plume-shared.css?v=24">
  <link rel="stylesheet" href="/nav-assets/nav-shared.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "plume",
    "brand": { "@type": "Brand", "name": "alegienne" },
    "description": "seasonal botanic smoke blends, grown and blended in the forest garden apothecary.",
    "image": "https://alegienne.com.au/plume-assets/plume-bg-poster.jpg"
  }
  </script>
</head>

<body>

  <!-- temporarily hidden — restore when ready
  <button type="button" class="aleg-menu-btn plume-nav-open" data-aleg-menu-open aria-expanded="false" aria-label="Open menu">
    <span></span><span></span>
  </button>
  -->

<!-- temporarily hidden along with the menu button
  <div class="aleg-panel" data-aleg-panel aria-hidden="true">
    <button type="button" class="aleg-panel-close" data-aleg-menu-close aria-label="Close menu">
      <span></span><span></span>
    </button>
    <nav class="aleg-panel-nav" aria-label="Alegienne menu">
      <a href="/about/">about</a>
      <a href="/apothecary/">apothecary</a>
      <a href="/florah">florah &middot; floral design studio</a>
    </nav>
  </div>
  -->


  <!-- the smoke, for the whole scroll (landing page only — the
       botanical/batch pages use a still textured background instead) -->
  <!-- no autoplay: the smoke stays parked on its first frame while the
       logo opens and the welcome types — PlumeUI starts it from the very
       beginning at the moment the fade-in begins -->
  <video class="video-bg" muted loop playsinline disablepictureinpicture
         poster="/plume-assets/plume-bg-poster.jpg" aria-hidden="true">
    <source src="/plume-assets/plume-smoke-bg-pingpong.webm" type="video/webm">
    <source src="/plume-assets/plume-smoke-bg-pingpong.mp4" type="video/mp4">
  </video>
  <div class="bg-tint" aria-hidden="true"></div>

  <!-- optional, for anyone motion-sensitive who wants the smoke still
       even without OS-level reduced-motion set — pause icon while the
       smoke plays, play icon once it's cleared -->
  <button type="button" class="smoke-toggle" aria-pressed="false" aria-label="clear the smoke">
    <svg class="icon-pause" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true" focusable="false"><rect x="2" y="1.5" width="2.6" height="9" rx="0.6"/><rect x="7.4" y="1.5" width="2.6" height="9" rx="0.6"/></svg>
    <svg class="icon-play" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M2.8 1.2v9.6l7.6-4.8z"/></svg>
  </button>

  <!-- 1. Plume -->
  <div class="plume-stage">
    <img src="/plume-assets/plume-dusk-01.png" alt="plume" class="logo">
  </div>

  <div class="container">

    <!-- 2. The welcome, typed -->
    <h1 aria-label="why, hello there gorgeous"><span class="type" aria-hidden="true">why, hello there gorgeous</span><span class="cursor" aria-hidden="true"></span></h1>

    <!-- 3. The buttons -->
    <div class="actions">
      <!-- points to the current season's batch page — update this href each
           time a new batch goes live (see the batch template at
           /plume/b/01/index.html for how to add a new one) -->
      <!-- temporarily hidden while we test the pilot batch — restore for subsequent batch blends
      <a class="btn stack" href="/plume/b/01/" aria-label="explore the botanicals — current batch">
        <span class="btn-line">explore the botanicals;</span>
        <span class="btn-line">get acquainted with the plants</span>
      </a>
      -->
    </div>

    <!-- 4. Everything below, arriving in sequence as you scroll -->

    <div class="divider reveal"></div>

    <p class="verse reveal">
      <span class="verse-lead">PLUME</span><br>
      a seasonal botanic smoke blend.<br><br>
      ...for baddies.<br><br>
    </p>

    <div class="divider reveal"></div>

    <p class="verse reveal">
      roll me,<br>
      <i>smoulder</i> me. <br>
      inhale me, <br><br>
      exhale blissfully.
    </p>

    <div class="divider reveal"></div>

    <p class="copy-line reveal">grown & blended<br> in the forest garden apothecary<br><br><br><br>with love,<br> <br>alegienne x</p>

   

    <p class="tagline reveal">
    </p>

    <img src="/alegienne-hand-gold.png?v=21" alt="with love from alegienne x" class="signature reveal">

    
    <!-- the re-order button, waiting at the very end of the scroll -->
    <div class="actions reorder reveal">
      <a class="btn stack" href="mailto:orders@alegienne.com.au?subject=re-order%3A%20plume" aria-label="re-order plume">
        <span class="btn-line"><i>more please</i></span>
        <span class="btn-line">re-order here</span>
      </a>
    </div>

  </div>

  <footer class="site-footer reveal">
    <p>&copy; always, alegienne.</p>
    <p class="footer-credit"><a href="https://studiorjl.com" target="_blank" rel="noopener">design by studio rjl</a> &middot; <a href="/plume/privacy/">privacy</a></p>
  </footer>

  <noscript>
    <style>
      .btn, .reveal, .reveal:not(.visible) { opacity: 1 !important; transform: none !important; }
      .divider.reveal { transform: scaleX(1) !important; }
      .cursor { display: none; }
    </style>
  </noscript>

  <script src="/plume-assets/plume-shared.js?v=24"></script>
  <script>PlumeUI.init();</script>
  <script src="/nav-assets/nav-shared.js" defer></script>
</body>
</html>
